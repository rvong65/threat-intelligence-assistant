name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q
        env:
          GITHUB_ACTIONS: "true"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t threat-intel-assistant:ci .

      - name: Run container
        run: |
          docker run -d --name threat-intel-ci -p 8501:8501 \
            -e DEPLOYMENT_PROFILE=cloud \
            threat-intel-assistant:ci

      - name: Wait for Streamlit health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8501/_stcore/health; then
              echo "Streamlit healthy"
              exit 0
            fi
            echo "Waiting for Streamlit... ($i/30)"
            sleep 10
          done
          echo "Health check failed"
          docker logs threat-intel-ci
          exit 1

      - name: Stop container
        if: always()
        run: docker rm -f threat-intel-ci
